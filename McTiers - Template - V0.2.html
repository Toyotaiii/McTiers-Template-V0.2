<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reply Desk – Support Template Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0f1218;--side:#131822;--panel:#181e2a;--panel2:#1e2533;--line:#2a3243;--text:#e8ebf2;--muted:#8d97ab;--accent:#7c9cff;--ok:#5fd4a0;
--appeals:#a78bfa;--reports:#f2b35e;--general:#4fd1c0;--bugs:#f27b8d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
aside{background:var(--side);border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:24px}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#7c9cff,#a78bfa);display:grid;place-items:center;color:#0f1218;box-shadow:0 6px 18px rgba(124,156,255,.28)}
.brand b{font-size:17px;letter-spacing:-.01em;display:block;line-height:1.2}
.brand span{font-size:12.5px;color:var(--muted)}
nav{display:flex;flex-direction:column;gap:4px}
.nav{--c:var(--accent);display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;background:none;border-radius:12px;color:var(--muted);cursor:pointer;text-align:left;font-weight:600;font-size:14.5px;position:relative;transition:background .2s,color .2s,transform .2s}
.nav svg{color:var(--c);opacity:.8;transition:opacity .2s}
.nav .n{margin-left:auto;font-size:12px;background:var(--panel2);padding:2px 8px;border-radius:99px;color:var(--muted);font-weight:600}
.nav:hover{background:var(--panel);color:var(--text)}
.nav:hover svg{opacity:1}
.nav.on{background:var(--panel2);color:var(--text)}
.nav.on::before{content:"";position:absolute;left:-16px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--c)}
.nav.on svg{opacity:1}
.tip{margin-top:auto;font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;line-height:1.5}
.tip b{color:var(--text);font-weight:600}
main{padding:28px clamp(16px,4vw,48px) 64px;max-width:1100px;width:100%}
.top{position:sticky;top:0;z-index:5;margin:-28px calc(-1 * clamp(16px,4vw,48px)) 0;padding:20px clamp(16px,4vw,48px) 16px;padding-top:calc(20px + env(safe-area-inset-top,0px));background:linear-gradient(var(--bg) 78%,rgba(15,18,24,0))}
.search{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:0 16px;height:56px;box-shadow:0 8px 28px rgba(0,0,0,.28);transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(124,156,255,.14),0 8px 28px rgba(0,0,0,.28)}
.search svg{color:var(--muted)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:16px}
.search input::placeholder{color:#6c7589}
.kbd{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:1px 8px}
.clear{display:none;border:0;background:var(--panel2);color:var(--muted);width:28px;height:28px;border-radius:50%;cursor:pointer;align-items:center;justify-content:center;transition:color .2s}
.clear:hover{color:var(--text)}
.search.has .clear{display:flex}.search.has .kbd{display:none}
.head{margin:22px 0 18px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.head h1{margin:0;font-size:clamp(24px,3.4vw,32px);letter-spacing:-.025em;font-weight:800}
.head p{margin:0;color:var(--muted);font-size:14.5px}
#list{display:flex;flex-direction:column;gap:12px}
#list.swap{animation:swap .28s ease}
@keyframes swap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{--c:var(--accent);background:var(--panel);border:1px solid var(--line);border-radius:18px;transition:border-color .2s,transform .2s,box-shadow .2s,background .2s;overflow:hidden}
.card:hover{border-color:#3a455c;transform:translateY(-1px);box-shadow:0 10px 30px rgba(0,0,0,.28)}
.card.open{border-color:color-mix(in srgb,var(--c) 55%,var(--line));background:linear-gradient(180deg,var(--panel2),var(--panel) 140px)}
.row{display:flex;align-items:flex-start;gap:8px;padding:6px 8px 0 6px}
.tog{flex:1;min-width:0;display:flex;gap:14px;align-items:flex-start;text-align:left;background:none;border:0;padding:14px 10px 12px;cursor:pointer;border-radius:14px}
.tog:focus-visible,.copy:focus-visible,.nav:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dot{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);flex:none}
.tt{min-width:0}
.tt h3{margin:0;font-size:16.5px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);padding:1px 9px;border-radius:99px}
.tt p{margin:2px 0 0;color:var(--muted);font-size:14px}
.chev{margin-left:auto;margin-top:10px;color:var(--muted);transition:transform .25s;flex:none}
.card.open .chev{transform:rotate(180deg)}
.copy{margin-top:12px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:8px 14px;font-weight:600;font-size:13.5px;cursor:pointer;transition:background .2s,border-color .2s,color .2s,transform .15s;flex:none}
.copy:hover{background:color-mix(in srgb,var(--c) 18%,var(--panel2));border-color:var(--c)}
.copy:active{transform:scale(.96)}
.copy.done{background:color-mix(in srgb,var(--ok) 18%,var(--panel2));border-color:var(--ok);color:var(--ok)}
.body{padding:0 16px 16px 70px}
.msg{margin:0;white-space:pre-wrap;word-break:break-word;font-size:14.5px;line-height:1.65;background:#0f131b;border:1px solid var(--line);border-left:3px solid var(--c);border-radius:6px 12px 12px 6px;padding:14px 16px;color:#cfd5e2;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-family:inherit}
.card.open .msg{-webkit-line-clamp:unset;display:block}
.ph{color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:5px;padding:0 4px;font-weight:600}
.ph.f{color:var(--text);background:color-mix(in srgb,var(--ok) 16%,transparent)}
.fields{display:none;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.card.open .fields{display:grid;animation:swap .25s ease}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
.fields input{background:#0f131b;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;outline:0;transition:border-color .2s,box-shadow .2s}
.fields input:focus{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 18%,transparent)}
.card.note{border-style:dashed}.badge.int,.badge.g{color:var(--text);background:var(--line)}.warn{font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:8px}.card.note .msg{border-left-style:dashed}
.grp{display:flex;align-items:center;gap:12px;margin:16px 4px 2px;font-size:14px;font-weight:700;color:var(--muted)}.grp::after{content:"";flex:1;height:1px;background:var(--line)}
.empty{text-align:center;color:var(--muted);padding:64px 20px;border:1px dashed var(--line);border-radius:18px}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);opacity:0;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:11px 18px;font-size:14px;font-weight:600;box-shadow:0 12px 36px rgba(0,0,0,.45);transition:.25s;pointer-events:none;z-index:20;display:flex;gap:10px;align-items:center;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast svg{color:var(--ok)}
mark{background:rgba(124,156,255,.16);color:#eef2ff;border-radius:5px;padding:0 3px;margin:0 -1px;box-shadow:0 0 0 1px rgba(124,156,255,.28),0 0 12px rgba(124,156,255,.4);text-shadow:0 0 8px rgba(124,156,255,.6);animation:mk .3s ease-out,glow 3s ease-in-out .3s infinite alternate}
@keyframes mk{from{background:transparent;box-shadow:0 0 0 0 transparent;color:inherit;text-shadow:none}}
@keyframes glow{from{box-shadow:0 0 0 1px rgba(124,156,255,.22),0 0 7px rgba(124,156,255,.25)}to{box-shadow:0 0 0 1px rgba(124,156,255,.34),0 0 15px rgba(124,156,255,.5)}}
.kws{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.kw{font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:1px 10px}
.modebar{display:flex;align-items:center;gap:14px;margin-top:12px;flex-wrap:wrap}
.mode{--m:#7c9cff;position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;min-width:300px;max-width:100%}
.mode[data-mode=internal]{--m:#f2b35e}
.thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:10px;background:color-mix(in srgb,var(--m) 20%,var(--panel2));border:1px solid color-mix(in srgb,var(--m) 55%,transparent);box-shadow:0 4px 16px color-mix(in srgb,var(--m) 22%,transparent);transition:transform .32s cubic-bezier(.4,0,.2,1),background .3s,border-color .3s,box-shadow .3s}
.mode[data-mode=internal] .thumb,.mode[data-scope=cat] .thumb{transform:translateX(100%)}
.mode.sc{--m:#4fd1c0}
.mode button{position:relative;z-index:1;border:0;background:none;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;transition:color .25s;white-space:nowrap}
.mode button:hover,.mode button[aria-checked=true]{color:var(--text)}
.mode button[aria-checked=true] svg{color:var(--m)}
.mode button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mhint{font-size:13px;color:var(--muted)}
@media(max-width:860px){
.app{grid-template-columns:minmax(0,1fr)}
aside{position:static;height:auto;flex-direction:row;align-items:center;padding:14px 16px 0;border:0;background:none;gap:0;flex-direction:column;align-items:stretch}
.brand{padding:0 0 12px}
nav{flex-direction:row;overflow-x:auto;gap:8px;padding-bottom:4px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.nav{width:auto;white-space:nowrap;background:var(--panel);border:1px solid var(--line);padding:9px 14px;flex:none}
.nav.on::before{display:none}.nav.on{border-color:var(--c)}
.tip{display:none}
main{padding-top:6px}
.top{margin-top:0;position:static;padding-top:14px;background:none}
.body{padding:0 14px 14px}
}
@media(max-width:560px){
.row{flex-wrap:wrap}.tog{flex-basis:100%}
.copy{margin:0 0 12px 14px}.copy span{display:inline}
.dot{display:none}.kbd{display:none}.mode{width:100%;min-width:0}.mode button{padding:9px 8px;font-size:13.5px}.mhint{display:none}
.tt p{font-size:13.5px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<!--glass-->
<style id="glass">
:root{--bg:#090c13;--panel:rgba(255,255,255,.055);--panel2:rgba(255,255,255,.095);--line:rgba(255,255,255,.13)}
body{background:#090c13}
.orbs{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.orbs i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(70px);opacity:.38;animation:drift 28s ease-in-out infinite alternate;will-change:transform}
.orbs i:nth-child(1){background:radial-gradient(circle,#5b7cff,transparent 65%);left:-12vmax;top:-14vmax}
.orbs i:nth-child(2){background:radial-gradient(circle,#a78bfa,transparent 65%);right:-16vmax;top:18vh;animation-duration:34s;animation-delay:-8s}
.orbs i:nth-child(3){background:radial-gradient(circle,#4fd1c0,transparent 65%);left:22vw;bottom:-24vmax;animation-duration:31s;animation-delay:-15s;opacity:.28}
@keyframes drift{to{transform:translate3d(8vmax,6vmax,0) scale(1.12)}}
.app{position:relative;z-index:1}
.search,.card,.mode,.tip,.copy,.empty,.kw,#toast,.nav.on{-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%)}
.search{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.03),0 12px 36px rgba(0,0,0,.35)}
.search:focus-within{border-color:rgba(160,185,255,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 0 4px rgba(124,156,255,.16),0 12px 36px rgba(0,0,0,.35)}
.nav.on{background:linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 6px 18px rgba(0,0,0,.25)}
.nav{transition:background .3s,color .3s,transform .35s cubic-bezier(.34,1.4,.5,1)}
.nav:hover{transform:translateX(3px)}
.tip,.empty{background:rgba(255,255,255,.05);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.card{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.03),0 14px 40px rgba(0,0,0,.32);transition:transform .45s cubic-bezier(.34,1.4,.5,1),border-color .3s,box-shadow .3s,background .35s}
.card::before{content:"";position:absolute;left:10%;right:10%;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);pointer-events:none}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(280px circle at var(--mx,50%) var(--my,-30%),rgba(255,255,255,.13),transparent 65%);opacity:0;transition:opacity .4s}
.card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.24);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 20px 50px rgba(0,0,0,.4)}
.card:hover::after{opacity:1}
.card.open{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 20%,rgba(255,255,255,.08)),rgba(255,255,255,.035) 70%);border-color:color-mix(in srgb,var(--c) 50%,rgba(255,255,255,.2))}
.dot{background:linear-gradient(145deg,color-mix(in srgb,var(--c) 28%,rgba(255,255,255,.1)),color-mix(in srgb,var(--c) 8%,transparent));box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.copy{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.25);transition:background .3s,border-color .3s,color .3s,transform .35s cubic-bezier(.34,1.5,.5,1)}
.copy:hover{background:color-mix(in srgb,var(--c) 26%,rgba(255,255,255,.08));transform:translateY(-1px) scale(1.04)}
.copy:active{transform:scale(.94)}
.msg{background:rgba(6,9,15,.5);border-color:rgba(255,255,255,.1);box-shadow:inset 0 2px 8px rgba(0,0,0,.25)}
.fields input{background:rgba(6,9,15,.5);border-color:rgba(255,255,255,.12)}
.kw{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14)}
.mode{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 8px 24px rgba(0,0,0,.25)}
.thumb{background:linear-gradient(180deg,color-mix(in srgb,var(--m) 42%,rgba(255,255,255,.22)),color-mix(in srgb,var(--m) 16%,rgba(255,255,255,.06)));border:1px solid rgba(255,255,255,.3);border-radius:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -8px 14px rgba(255,255,255,.05),0 8px 22px color-mix(in srgb,var(--m) 34%,transparent);transition:transform .6s cubic-bezier(.34,1.45,.5,1),background .45s,box-shadow .45s}
.mode button{transition:color .3s}
#toast{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 16px 40px rgba(0,0,0,.45)}
@keyframes swap{from{opacity:0;transform:translateY(12px) scale(.985);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
#list.swap{animation:swap .5s cubic-bezier(.2,.8,.2,1)}
@media(min-width:861px){
aside{background:rgba(255,255,255,.035);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);box-shadow:inset -1px 0 0 rgba(255,255,255,.06)}
.top{background:linear-gradient(rgba(9,12,19,.7) 70%,rgba(9,12,19,0))}
}
@media(max-width:560px){.card,.search,.mode,.copy,.kw{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}.orbs i{filter:blur(50px)}}
@media(prefers-reduced-motion:reduce){.orbs i{animation:none}}
</style>
<style id="motion">
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.orbs i{filter:none;opacity:.34;animation-duration:44s}
#toast{-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%)}
.search,.mode{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(24,30,44,.78)}
.card,.copy,.kw,.empty,.tip,.nav.on{-webkit-backdrop-filter:none;backdrop-filter:none}
@media(min-width:861px){aside{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(255,255,255,.04)}}
@media(max-width:560px){.card,.copy,.kw{-webkit-backdrop-filter:none;backdrop-filter:none}}
mark{animation:mk .3s ease-out,glow 3s ease-in-out .3s 3 alternate}
/* list switching */
#list{transition:opacity .13s ease,transform .13s ease}
#list.out{opacity:0;transform:translateY(8px)}
#list.swap{animation:none}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
#list.swap .card,#list.swap .grp,#list.swap .empty{animation:rise .5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,6)*40ms)}
@keyframes headin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.head.pop{animation:headin .45s cubic-bezier(.2,.8,.2,1)}
@keyframes bar{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.nav.on::before{animation:bar .45s cubic-bezier(.34,1.5,.5,1)}
/* press feedback */
.nav:active,.mode button:active,.clear:active{transform:scale(.96)}
.tog:active .dot{transform:scale(.9)}
.dot{transition:transform .35s cubic-bezier(.34,1.5,.5,1)}
.chev{transition:transform .45s cubic-bezier(.34,1.5,.5,1),color .2s}
.tog:hover .chev{color:var(--text)}
.copy,.mode button,.tog,.clear,.gtab{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.26);transform:scale(0);animation:rip .6s ease-out forwards}
@keyframes rip{to{transform:scale(1);opacity:0}}
@keyframes pop{40%{transform:scale(1.12)}}
.copy.done{animation:pop .4s ease}
/* smooth expand and collapse */
.msg{display:block;-webkit-line-clamp:unset;max-height:calc(3.3em + 30px);overflow:hidden;transition:max-height .5s cubic-bezier(.2,.8,.2,1)}
.card.open .msg{max-height:640px}
.fields{display:grid;max-height:0;opacity:0;margin-bottom:0;overflow:hidden;visibility:hidden;transition:max-height .45s cubic-bezier(.2,.8,.2,1),opacity .3s ease,margin .35s ease,visibility 0s .45s}
.card.open .fields{animation:none;max-height:240px;opacity:1;margin-bottom:12px;visibility:visible;transition-delay:0s}
@media(prefers-reduced-motion:reduce){#list,.msg,.fields{transition:none!important}}
</style>
<style id="breathe">
.orbs i{will-change:transform,opacity;animation:drift 44s ease-in-out infinite alternate,breathe 9s ease-in-out infinite alternate}
.orbs i:nth-child(1){animation-duration:44s,9s;animation-delay:0s,0s}
.orbs i:nth-child(2){animation-duration:36s,12s;animation-delay:-8s,-4s}

+sec("Staff Rules",`<ol class="rules"><li class="sv">Do not leak anything in tester chat or staff chats under any circumstances. This rule is taken <b>VERY</b> seriously.</li><li>Toxicity and disruptive or excessively negative activity are strictly forbidden.</li><li>Always remain respectful and professional when handling support tickets. Stay on topic and maintain a positive attitude.</li><li>Taking any form of payment from players in exchange for testing, receiving tiers, skipping players, boosting other players, or similar activities is forbidden and may result in punishment.</li><li class="sv">Do not attempt to screenshare players. This permission is restricted to ${rl("Regulators")} and above. This rule is taken <b>VERY</b> seriously.</li></ol>`)
+sec("Punishments",`<div class="pgrid">`+[
["Participating in Discord Through Unknown Alternate Accounts","Usually an account ban","b",["This should usually result in an account ban unless there is clearly no negative intent."]],
["Harassment / Threats / Phishing / Malware / Doxing / DDoSing","Ban immediately","b",[]],
["NSFW Media / Discussions","7-day timeout or instant ban","t",["Any NSFW media should result in an instant ban."]],

["Malicious Gossip","7-day timeout or instant ban","t",["Use discretion.","Includes spreading false rumors or intentionally mischaracterizing people to damage their reputation."]],
["Spamming","Use discretion","d",["Depends on severity.","For example, hateful spam may be considered malicious and banworthy, whereas minor repetition may not be ill-intended."]],

].map(p=>`<div class="pi"><h4>${p[0]}</h4><span class="ptag ${p[2]}">${p[1]}</span>${p[3].length?ul(p[3]):""}</div>`).join("")+`</div>`)
+sec("Blacklists","<p>When a user is blacklisted:</p>"+ol([
`A message will appear in ${cp("#blacklisted-players","dc")} containing the user's Discord ID.`,"Ban the user.","React with a checkmark once the ban is completed.",
`You can use Discord's ${cmd("/ban")} command to ban users who are not in the server.`])+gnote(1,"Important",`<p>Use Carl-Bot for all bans in ${ch(CARL)}.</p>`))

};
function guideHTML(){
  return `<div class="gwrap"><div class="gtabs" role="tablist" aria-label="Guide sections">${GTABS.map(g=>`<button class="gtab${g[0]===gsec?" on":""}" role="tab" aria-selected="${g[0]===gsec}" data-g="${g[0]}">${ic(g[2])}<span>${g[1]}</span></button>`).join("")}</div><div class="gpanel" id="gpanel">${GP[gsec]()}</div></div>`;
}
function gGo(k){
  if(k===gsec)return;
  gsec=k;
  list.querySelectorAll(".gtab").forEach(b=>{const on=b.dataset.g===k;b.classList.toggle("on",on);b.setAttribute("aria-selected",on)});
  const p=$("#gpanel");if(!p)return;
  clearTimeout(gGo.t);p.classList.add("out");
  gGo.t=setTimeout(()=>{p.innerHTML=GP[gsec]();p.classList.remove("out","swap");void p.offsetWidth;p.classList.add("swap");
    const r=$(".gtabs").getBoundingClientRect();if(r.top<0)scrollTo({top:scrollY+r.top-72,behavior:"smooth"})},130);
}
list.addEventListener("click",e=>{
  const g=e.target.closest("[data-g]");
  if(g){gGo(g.dataset.g);return}
  const c=e.target.closest("[data-copy]");
  if(c){copyText(c.dataset.copy);toast("Copied "+c.dataset.copy)}
});
list.addEventListener("keydown",e=>{
  if(e.target.classList&&e.target.classList.contains("gtab")&&(e.key==="ArrowLeft"||e.key==="ArrowRight")){e.preventDefault();const i=GTABS.findIndex(g=>g[0]===gsec),n=GTABS[(i+(e.key==="ArrowRight"?1:-1)+GTABS.length)%GTABS.length][0];gGo(n);list.querySelector(`.gtab[data-g="${n}"]`).focus()}
  if((e.key==="Enter"||e.key===" ")&&e.target.dataset&&e.target.dataset.copy){e.preventDefault();e.target.click()}});
if(scrollY>10)closeSearch();
render(false);
</script>
